<title>MSc CS Exam Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single study column; sticky top bar with subject + views; cards that hide the answer until tapped. */
:root {
  --bg: #f3f6f7;
  --surface: #ffffff;
  --surface-2: #e8eef0;
  --fg: #142026;
  --muted: #56666e;
  --line: #d3dde1;
  --accent: #0b7a75;        /* teal: data / clusters */
  --accent-soft: #d6efed;
  --hot: #c2410c;           /* most-asked */
  --hot-soft: #fde7da;
  --star: #a16207;
  --ok: #15803d;
  --ok-soft: #dcf3e3;
  --code-bg: #eef3f4;
  --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1518; --surface: #152025; --surface-2: #1c2a30; --fg: #e3ecef; --muted: #93a6ad;
    --line: #2a3a41; --accent: #3cc4bc; --accent-soft: #123a39; --hot: #fb8a4c; --hot-soft: #3d2216;
    --star: #e2b33f; --ok: #4ade80; --ok-soft: #13311f; --code-bg: #10191d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1518; --surface: #152025; --surface-2: #1c2a30; --fg: #e3ecef; --muted: #93a6ad;
  --line: #2a3a41; --accent: #3cc4bc; --accent-soft: #123a39; --hot: #fb8a4c; --hot-soft: #3d2216;
  --star: #e2b33f; --ok: #4ade80; --ok-soft: #13311f; --code-bg: #10191d; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar .wrap { padding-block: 10px; display: flex; flex-direction: column; gap: 10px; }
.brand { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
.brand h1 { font-family: var(--font-display); font-size: 1.15rem; margin: 0; letter-spacing: -0.01em; }
.brand h1 span { color: var(--accent); }
.subject { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted); }
.subject select { font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); }
.views { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.views a { flex: none; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 0.85rem; padding: 6px 12px; border-radius: 999px; border: 1px solid transparent; }
.views a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); border-color: var(--accent); }

main .wrap { padding-block: 18px 60px; display: flex; flex-direction: column; gap: 16px; }

/* progress */
.progress-panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.prog { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.prog .lbl { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.prog .lbl b { color: var(--fg); font-weight: 600; }
.meter { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }
.sync { font-size: 0.75rem; color: var(--muted); }

/* toolbar */
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 7px 12px; font-size: 0.85rem; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 0.8rem; font-weight: 500; }
.chip[aria-pressed="true"] { border-color: var(--hot); color: var(--hot); background: var(--hot-soft); }

/* cards */
.list { display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.card.learned { border-color: var(--ok); }
.card-head { display: flex; gap: 12px; align-items: flex-start; padding: 14px 14px 12px; }
.qnum { flex: none; font-family: var(--font-mono); font-size: 0.78rem; font-weight: 500; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 2px 7px; margin-top: 2px; }
.qtext { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.qtext h3 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.02rem; line-height: 1.35; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 0.72rem; }
.badge { border-radius: 5px; padding: 1px 7px; font-weight: 600; letter-spacing: 0.02em; }
.badge.top { background: var(--hot-soft); color: var(--hot); }
.badge.star { background: var(--surface-2); color: var(--star); }
.badge.asked { background: var(--surface-2); color: var(--muted); font-weight: 500; }
.card-actions { display: flex; gap: 8px; padding: 0 14px 14px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 7px 12px; font-size: 0.85rem; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.done { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.hint { font-size: 0.8rem; color: var(--muted); padding: 0 14px 12px; margin: 0; }

/* rendered answer */
.answer { border-top: 1px dashed var(--line); padding: 14px; min-width: 0; }
.answer > *:first-child { margin-top: 0; }
.answer h3, .answer h4 { font-family: var(--font-display); font-size: 0.98rem; margin: 18px 0 6px; }
.answer p, .answer li { max-width: 68ch; }
.answer ul, .answer ol { padding-left: 1.3em; }
.answer code { font-family: var(--font-mono); font-size: 0.86em; background: var(--code-bg); padding: 1px 4px; border-radius: 4px; }
.answer pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; line-height: 1.35; }
.answer pre code { background: none; padding: 0; font-size: 0.8rem; }
.answer table { display: block; overflow-x: auto; border-collapse: collapse; font-size: 0.86rem; margin: 10px 0; max-width: 100%; }
.answer th, .answer td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
.answer th { background: var(--surface-2); }
.answer strong { color: var(--fg); }
.answer blockquote { margin: 8px 0; padding-left: 10px; border-left: 3px solid var(--accent); color: var(--muted); }

/* flashcards */
.flash { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-height: 240px; padding: 22px 18px; display: flex; flex-direction: column; gap: 14px; justify-content: center; text-align: center; cursor: pointer; }
.flash .side { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.flash .front { font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; text-wrap: balance; }
.flash .back { text-align: left; font-size: 0.95rem; }
.flash.known { border-color: var(--ok); }
.flash-nav { display: flex; gap: 8px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.counter { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.85rem; }

/* formulas */
.formula-group { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.formula-group h2 { font-family: var(--font-display); font-size: 1rem; margin: 0; color: var(--accent); }
.f { display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr); gap: 4px 12px; align-items: baseline; padding-top: 8px; border-top: 1px solid var(--line); }
.f:first-of-type { border-top: 0; padding-top: 0; }
.f .n { font-size: 0.85rem; font-weight: 600; }
.f .e { font-family: var(--font-mono); font-size: 0.84rem; overflow-x: auto; white-space: pre; }
.f .r { grid-column: 2; font-size: 0.75rem; color: var(--muted); }
@media (max-width: 520px) { .f { grid-template-columns: minmax(0, 1fr); } .f .r { grid-column: 1; } }

/* mock */
.timer { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.clock { font-family: var(--font-mono); font-size: 2rem; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.clock.low { color: var(--hot); }
.paper { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.paper header { text-align: center; display: flex; flex-direction: column; gap: 2px; }
.paper header b { font-family: var(--font-display); }
.paper header small { color: var(--muted); }
.paper h4 { margin: 8px 0 0; font-family: var(--font-display); text-align: center; }
.paper ol { margin: 0; padding-left: 1.6em; display: flex; flex-direction: column; gap: 4px; }
.paper .instr { font-size: 0.85rem; color: var(--muted); margin: 0; }
.paper .marks { text-align: right; font-weight: 600; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.paper li a { color: inherit; }

.syl { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.syl h2 { font-family: var(--font-display); font-size: 1rem; margin: 0; color: var(--accent); }
.syl p { margin: 0; font-size: 0.9rem; color: var(--muted); max-width: 72ch; }
.steps { margin: 0; padding-left: 1.3em; font-size: 0.85rem; display: flex; flex-direction: column; gap: 2px; }
#topics { margin-top: 12px; }
.note { color: var(--muted); font-size: 0.85rem; }
.shorts { margin: 0; display: flex; flex-direction: column; gap: 4px; }
.shorts dt { font-weight: 600; margin-top: 8px; }
.shorts dd { margin: 0; max-width: 68ch; }
.empty { color: var(--muted); padding: 24px; text-align: center; background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; }
.section-title { font-family: var(--font-display); font-size: 1.05rem; margin: 6px 0 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="bar">
  <div class="wrap">
    <div class="brand">
      <h1>MSc CS <span>Exam Desk</span></h1>
      <label class="subject" for="subjectSel">Subject
        <select id="subjectSel"></select>
      </label>
    </div>
    <nav class="views" aria-label="Views">
      <a href="#understand" data-view="understand">1 · Understand</a>
      <a href="#learn" data-view="learn">2 · Essays (8 marks)</a>
      <a href="#flashcards" data-view="flashcards">3 · Short answers (3 marks)</a>
      <a href="#formulas" data-view="formulas">Formulas</a>
      <a href="#mock" data-view="mock">Mock exam</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <section class="progress-panel" id="progress" aria-label="Progress"></section>
    <p class="sync" id="sync">Progress saves in this browser.</p>
    <div id="view"><p class="empty">Loading the answer sheet…</p></div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
<script>
(() => {
  /* ---------- subjects: content comes only from each subject's exam-answers.md ---------- */
  const SUBJECTS = [
    {
      code: "DCS31", name: "Data Mining & Warehousing", file: "dcs31.md",
      notes: { 1: "dcs31-m1.md", 2: "dcs31-m2.md", 3: "dcs31-m3.md" },
      syllabus: {
        1: "Introduction to Data Mining. Different kinds of data and patterns that are mined. Technologies used. Applications, Major Issues. Data Objects and Attribute Types, Basic Statistical Description of Data – Data visualization, Measuring Data Similarity and Dissimilarity. Data Pre-processing, Data cleaning, Data Integration, Data Reduction, Data Transformation and Data Discretization.",
        2: "Basic concepts of Data Warehousing. Data warehousing modeling: Data cube and OLAP – Data warehouse design and usage. Data warehouse Implementation. Data cube Technology. Classification, Decision Tree Induction, Bayes classification, Rule based classification, classification by back propagation.",
        3: "Cluster Analysis: Partitioning methods, Hierarchical methods. Outlier – Outlier detection techniques. Advanced Techniques, Web Mining, Text mining, Spatial and Temporal Mining. Data mining Applications, Data mining and society. Data mining Trends, Data mining softwares.",
      },
      exam: "Third Semester M.Sc. Degree Examination · SDE · Computer Science",
      // Extra answers (Q16+) sit outside the module sections; map them to their syllabus module.
      extraModule: { 16: 2, 17: 1, 18: 1, 19: 2, 20: 2, 21: 3, 22: 3, 23: 3, 24: 1, 25: 1, 26: 1, 27: 3, 28: 3 },
      top: [13, 2, 11, 16, 3, 6, 19, 20],
      formulas: [
        { g: "Similarity & distance", items: [
          ["Euclidean (L2)", "d(i,j) = √Σ (x_if − x_jf)²", "Q3"],
          ["Manhattan (L1)", "d(i,j) = Σ |x_if − x_jf|", "Q3"],
          ["Minkowski (Lh)", "d(i,j) = (Σ |x_if − x_jf|^h)^(1/h)", "h=1 Manhattan, h=2 Euclidean"],
          ["Supremum (L∞)", "d(i,j) = max_f |x_if − x_jf|", "Q3"],
          ["Nominal", "d(i,j) = (p − m) / p", "m = matches, p = attributes"],
          ["Symmetric binary", "d = (r + s) / (q + r + s + t)", "q=1·1, r=1·0, s=0·1, t=0·0"],
          ["Asymmetric binary", "d = (r + s) / (q + r + s)", "ignores t"],
          ["Jaccard similarity", "sim = q / (q + r + s)", ""],
          ["Ordinal", "z = (r − 1) / (M − 1)", "rank r of M levels"],
          ["Cosine", "cos(x,y) = (x·y) / (‖x‖ ‖y‖)", "documents"],
        ]},
        { g: "Preprocessing", items: [
          ["Min-max", "v′ = (v − min)/(max − min) × (new_max − new_min) + new_min", "Q4"],
          ["Z-score", "v′ = (v − mean) / σ", "Q4"],
          ["Decimal scaling", "v′ = v / 10^j", "smallest j with max|v′| < 1"],
          ["IQR / outlier", "IQR = Q3 − Q1; outlier beyond 1.5 × IQR", "five-number summary"],
        ]},
        { g: "Classification", items: [
          ["Entropy", "Info(D) = −Σ p_i log₂ p_i", "Q9"],
          ["Info after split", "Info_A(D) = Σ (|D_j|/|D|) × Info(D_j)", "Q9"],
          ["Information gain", "Gain(A) = Info(D) − Info_A(D)", "ID3 picks max"],
          ["Bayes theorem", "P(H|X) = P(X|H) · P(H) / P(X)", "Q16"],
          ["Naive Bayes", "P(X|Ci) = Π_k P(x_k|Ci); pick max P(X|Ci)·P(Ci)", "Laplace: add 1 to counts"],
          ["Rule coverage", "coverage = n_covers / |D|", "Q10"],
          ["Rule accuracy", "accuracy = n_correct / n_covers", "Q10"],
          ["FOIL_Prune", "(pos − neg) / (pos + neg)", "Q10"],
        ]},
        { g: "Backpropagation (Q11)", items: [
          ["Net input", "I_j = Σ_i w_ij O_i + θ_j", ""],
          ["Sigmoid output", "O_j = 1 / (1 + e^(−I_j))", ""],
          ["Output error", "Err_j = O_j (1 − O_j)(T_j − O_j)", ""],
          ["Hidden error", "Err_j = O_j (1 − O_j) Σ_k Err_k w_jk", ""],
          ["Weight update", "w_ij = w_ij + (l) Err_j O_i", "l = learning rate"],
          ["Bias update", "θ_j = θ_j + (l) Err_j", ""],
        ]},
        { g: "Warehouse & clustering", items: [
          ["Cuboids (no hierarchy)", "2ⁿ", "n dimensions"],
          ["Cuboids (hierarchies)", "T = Π (L_i + 1)", "L_i levels of dimension i"],
          ["k-means SSE", "E = Σ_i Σ_{p∈Ci} dist(p, c_i)²", "Q13"],
          ["BIRCH clustering feature", "CF = ⟨n, LS, SS⟩", "Q21"],
          ["TF-IDF", "TF(t,d) × log(N / df_t)", "text mining"],
        ]},
      ],
    },
  ];

  /* ---------- state ---------- */
  const LS_KEY = "examdesk-progress-v1";
  let progress = { learned: {}, known: {} };       // keys like "DCS31:Q13", "DCS31:A5"
  try { const s = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if (s && typeof s === "object") progress = { learned: s.learned || {}, known: s.known || {} }; } catch (e) {}

  let remoteRef = null, writing = false, pendingWrite = false, writeTimer = null;
  const syncEl = document.getElementById("sync");

  function saveProgress() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(progress)); } catch (e) {}
    if (!remoteRef) return;
    clearTimeout(writeTimer);
    writeTimer = setTimeout(flushRemote, 800);
  }
  async function flushRemote() {
    if (writing) { pendingWrite = true; return; }
    writing = true;
    try { await remoteRef.set({ learned: progress.learned, known: progress.known, v: 1 }); syncEl.textContent = "Progress synced to your account."; }
    catch (e) { syncEl.textContent = "Couldn't sync just now. Progress is still saved in this browser."; }
    writing = false;
    if (pendingWrite) { pendingWrite = false; flushRemote(); }
  }
  async function connectStore() {
    try {
      if (!window.claude || !window.claude.use) return;
      const [user, db] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
      if (!user || !db) return;
      const id = await user.id();
      if (!id) return;
      remoteRef = db.collection("data/users/" + id).doc("examdesk-progress");
      const snap = await remoteRef.get();
      if (snap.exists) {
        const d = snap.data() || {};
        progress = { learned: Object.assign({}, progress.learned, d.learned || {}), known: Object.assign({}, progress.known, d.known || {}) };
        try { localStorage.setItem(LS_KEY, JSON.stringify(progress)); } catch (e) {}
        render();
      }
      syncEl.textContent = "Progress syncs to your account, so it follows you to your phone.";
    } catch (e) { remoteRef = null; }
  }

  /* ---------- parsing exam-answers.md ---------- */
  const cache = {};
  async function loadSubject(sub) {
    if (cache[sub.code]) return cache[sub.code];
    const res = await fetch(sub.file);
    if (!res.ok) throw new Error("fetch " + res.status);
    const md = await res.text();
    const data = parse(md, sub);
    data.topics = parseChecklist(md);
    data.notes = {};
    await Promise.all(Object.entries(sub.notes || {}).map(async ([m, f]) => {
      try { const r = await fetch(f); if (r.ok) data.notes[m] = parseNotes(await r.text()); } catch (e) {}
    }));
    cache[sub.code] = data;
    return data;
  }

  // Syllabus coverage checklist rows: | module | topic | where (Q refs, Notes M# §a–b) |
  function parseChecklist(md) {
    const topics = [];
    let inCk = false;
    for (const line of md.split(/\r?\n/)) {
      if (/^## Syllabus coverage checklist/i.test(line)) { inCk = true; continue; }
      if (inCk && /^#|^---\s*$/.test(line)) break;
      if (!inCk) continue;
      const m = line.match(/^\|\s*(\d)\s*\|\s*(.+?)\s*\|\s*(.+?)\s*\|\s*$/);
      if (!m) continue;
      const notes = [];
      for (const r of m[3].matchAll(/Notes M(\d) §(\d+)(?:[–-](\d+))?/g)) {
        const from = +r[2], to = r[3] ? +r[3] : from;
        for (let s = from; s <= to; s++) notes.push({ m: +r[1], s });
      }
      topics.push({ module: +m[1], title: m[2], qs: [...m[3].matchAll(/Q(\d+)/g)].map((x) => +x[1]), notes });
    }
    topics.forEach((t, i) => { t.id = "T" + (i + 1); });
    return topics;
  }

  // Module notes: numbered "## N. Title" sections.
  function parseNotes(md) {
    const secs = {};
    let cur = null, inFence = false;
    for (const line of md.split(/\r?\n/)) {
      if (/^```/.test(line)) inFence = !inFence;
      if (!inFence && /^## /.test(line)) {
        const m = line.match(/^## (\d+)\.\s*(.*)$/);
        cur = m ? (secs[+m[1]] = { title: m[2].trim(), body: [] }) : null;
        continue;
      }
      if (cur) cur.body.push(line);
    }
    Object.values(secs).forEach((s) => { s.body = s.body.join("\n").replace(/\n-{3,}\s*$/m, "").trim(); });
    return secs;
  }

  function parse(md, sub) {
    const lines = md.split(/\r?\n/);
    const longs = [], partA = [];
    let section = null, moduleNo = 0, cur = null, inFence = false;
    const flush = () => { if (cur) { cur.body = cur.body.join("\n").trim(); longs.push(cur); cur = null; } };
    for (const line of lines) {
      if (/^```/.test(line)) inFence = !inFence;
      if (!inFence && /^# /.test(line)) {
        flush();
        const h = line.slice(2).trim();
        const m = h.match(/^MODULE\s+(\d)/i);
        if (m) { section = "module"; moduleNo = +m[1]; }
        else if (/^PART A/i.test(h)) section = "partA";
        else if (/8-MARK/i.test(h)) section = "extra";
        else section = "other";
        continue;
      }
      if (!inFence && /^## /.test(line) && (section === "module" || section === "extra")) {
        flush();
        const h = line.slice(3).trim();
        const qm = h.match(/^Q(\d+)\.\s*(.*)$/);
        if (!qm) continue;
        const n = +qm[1];
        const stars = (qm[2].match(/⭐/g) || []).length;
        const title = qm[2].replace(/⭐/g, "").trim();
        const mod = section === "module" ? moduleNo : (sub.extraModule[n] || 0);
        cur = { n, title, stars, module: mod, asked: "", body: [] };
        continue;
      }
      if (cur) {
        const am = line.match(/^\*\*Asked:\*\*\s*(.*)$/);
        if (am && !cur.asked) { cur.asked = am[1].trim(); continue; }
        cur.body.push(line);
      } else if (section === "partA") {
        const pm = line.match(/^\*\*(.+?)\*\*\s*(?:[—-]\s*)?(.+)$/);
        if (pm) partA.push({ q: pm[1].trim(), a: pm[2].trim() });
      }
    }
    flush();
    longs.sort((a, b) => a.module - b.module || a.n - b.n);
    partA.forEach((p, i) => { p.id = "A" + (i + 1); });
    return { longs, partA };
  }

  const mdToHtml = (s) => (window.marked ? window.marked.parse(s) : "<pre>" + esc(s) + "</pre>");
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const inline = (s) => (window.marked ? window.marked.parseInline(s) : esc(s));

  /* ---------- UI state ---------- */
  const subSel = document.getElementById("subjectSel");
  SUBJECTS.forEach((s, i) => { const o = document.createElement("option"); o.value = i; o.textContent = s.code + " · " + s.name; subSel.appendChild(o); });
  let subIdx = 0;
  try { const v = +localStorage.getItem("examdesk-subject"); if (SUBJECTS[v]) subIdx = v; } catch (e) {}
  subSel.value = subIdx;
  subSel.addEventListener("change", () => { subIdx = +subSel.value; try { localStorage.setItem("examdesk-subject", subIdx); } catch (e) {} render(); });

  let moduleTab = 1, topOnly = false, flashIdx = 0, flashFlipped = false, flashOrder = null;
  const opened = new Set();
  let mock = null; // { paper, endsAt, remaining, running, showAns }

  const VIEWS = ["understand", "learn", "flashcards", "formulas", "mock"];
  const currentView = () => { const h = location.hash.slice(1); return VIEWS.includes(h) ? h : "understand"; };
  let uModule = 1;
  const topicOpen = {}; // key -> "notes" | "short"
  window.addEventListener("hashchange", render);

  const key = (k) => SUBJECTS[subIdx].code + ":" + k;

  /* ---------- render ---------- */
  async function render() {
    const view = currentView();
    document.querySelectorAll(".views a").forEach((a) => a.setAttribute("aria-current", a.dataset.view === view ? "page" : "false"));
    const sub = SUBJECTS[subIdx];
    const root = document.getElementById("view");
    let data;
    try { data = await loadSubject(sub); }
    catch (e) { root.innerHTML = '<p class="empty">The answer sheet for ' + esc(sub.code) + " couldn't load. Check your connection and reopen the page.</p>"; return; }
    renderProgress(sub, data);
    if (view === "understand") renderUnderstand(root, sub, data);
    else if (view === "learn") renderLearn(root, sub, data);
    else if (view === "flashcards") renderFlash(root, sub, data);
    else if (view === "formulas") renderFormulas(root, sub);
    else renderMock(root, sub, data);
  }

  function renderProgress(sub, data) {
    const el = document.getElementById("progress");
    const cells = [1, 2, 3].map((m) => {
      const qs = data.longs.filter((q) => q.module === m);
      const done = qs.filter((q) => progress.learned[key("Q" + q.n)]).length;
      return { label: "Module " + m, done, total: qs.length };
    });
    const known = data.partA.filter((p) => progress.known[key(p.id)]).length;
    const und = data.topics.filter((t) => progress.learned[key(t.id)]).length;
    cells.unshift({ label: "Topics understood", done: und, total: data.topics.length });
    cells.push({ label: "Short answers", done: known, total: data.partA.length });
    el.innerHTML = cells.map((c) => {
      const pct = c.total ? Math.round((100 * c.done) / c.total) : 0;
      return '<div class="prog"><div class="lbl"><b>' + c.label + "</b><span>" + c.done + " / " + c.total + '</span></div><div class="meter" role="progressbar" aria-label="' + c.label + ' progress" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100"><i style="width:' + pct + '%"></i></div></div>';
    }).join("");
  }

  function goToEssay(m, n) {
    moduleTab = m; topOnly = false; opened.add(key("Q" + n));
    if (location.hash === "#learn") render(); else location.hash = "learn";
    setTimeout(() => { const t = document.getElementById("q" + n); if (t) t.scrollIntoView({ block: "start" }); }, 120);
  }

  function shortAnswersFor(data, qs) {
    const set = new Set(qs);
    return data.partA.filter((p) => [...p.a.matchAll(/Q(\d+)/g)].some((x) => set.has(+x[1])));
  }

  function renderUnderstand(root, sub, data) {
    const qByN = {}; data.longs.forEach((q) => { qByN[q.n] = q; });
    const topics = data.topics.filter((t) => t.module === uModule);
    root.innerHTML =
      '<div class="tools"><div class="seg" role="group" aria-label="Module">' +
      [1, 2, 3].map((m) => '<button type="button" data-m="' + m + '" aria-pressed="' + (m === uModule) + '">Module ' + m + "</button>").join("") + "</div></div>" +
      '<section class="syl"><h2>Module ' + uModule + ' syllabus</h2><p>' + esc((sub.syllabus || {})[uModule] || "") + "</p>" +
      '<ol class="steps"><li><b>Understand</b> each topic below in order: read it, then tick <i>Understood</i>.</li><li><b>Essays</b>: open the topic\'s 8-mark answer and learn its skeleton.</li><li><b>Short answers</b>: test yourself on the 3-mark questions.</li></ol></section>' +
      '<div class="list" id="topics"></div>';
    root.querySelectorAll("[data-m]").forEach((b) => b.addEventListener("click", () => { uModule = +b.dataset.m; render(); }));
    const list = root.querySelector("#topics");
    topics.forEach((t, i) => list.appendChild(topicCard(t, i + 1, data, qByN)));
  }

  function topicCard(t, idx, data, qByN) {
    const k = key(t.id);
    const done = !!progress.learned[k];
    const mode = topicOpen[k] || "";
    const shorts = shortAnswersFor(data, t.qs);
    const el = document.createElement("article");
    el.className = "card topic" + (done ? " learned" : "");
    const essayBtns = t.qs.map((n) => { const q = qByN[n]; return q ? '<button type="button" class="btn" data-essay="' + q.module + ":" + n + '">Essay Q' + n + (q.stars ? " " + "★".repeat(q.stars) : "") + "</button>" : ""; }).join("");
    el.innerHTML =
      '<div class="card-head"><span class="qnum">' + uModule + "." + idx + '</span><div class="qtext"><h3>' + esc(t.title) + "</h3></div></div>" +
      '<div class="card-actions">' +
      '<button type="button" class="btn ' + (mode === "notes" ? "" : "primary") + '" data-act="notes">' + (mode === "notes" ? "Hide explanation" : "Understand") + "</button>" +
      essayBtns +
      (shorts.length ? '<button type="button" class="btn" data-act="short">' + (mode === "short" ? "Hide short answers" : "Short answers (" + shorts.length + ")") + "</button>" : "") +
      '<button type="button" class="btn ' + (done ? "done" : "") + '" data-act="done" aria-pressed="' + done + '">' + (done ? "Understood ✓" : "Mark understood") + "</button></div>";

    if (mode === "notes") {
      const parts = t.notes.map((r) => (data.notes[r.m] || {})[r.s]).filter(Boolean);
      let html;
      if (parts.length) html = parts.map((s) => "<h3>" + inline(s.title) + "</h3>" + mdToHtml(s.body)).join("");
      else {
        const q = qByN[t.qs[0]];
        html = q ? '<p class="note">This topic is explained in full in essay Q' + q.n + ":</p>" + mdToHtml(q.body) : '<p class="note">No explanation found for this topic yet.</p>';
      }
      el.insertAdjacentHTML("beforeend", '<div class="answer">' + html + "</div>");
    } else if (mode === "short") {
      el.insertAdjacentHTML("beforeend", '<div class="answer"><dl class="shorts">' + shorts.map((p) => "<dt>" + inline(p.q) + "</dt><dd>" + inline(p.a) + "</dd>").join("") + "</dl></div>");
    }
    const rerender = () => el.replaceWith(topicCard(t, idx, data, qByN));
    el.querySelector('[data-act="notes"]').addEventListener("click", () => { topicOpen[k] = mode === "notes" ? "" : "notes"; rerender(); });
    const sb = el.querySelector('[data-act="short"]');
    if (sb) sb.addEventListener("click", () => { topicOpen[k] = mode === "short" ? "" : "short"; rerender(); });
    el.querySelector('[data-act="done"]').addEventListener("click", () => {
      if (progress.learned[k]) delete progress.learned[k]; else progress.learned[k] = true;
      saveProgress(); rerender(); renderProgress(SUBJECTS[subIdx], data);
    });
    el.querySelectorAll("[data-essay]").forEach((b) => b.addEventListener("click", () => { const [m, n] = b.dataset.essay.split(":").map(Number); goToEssay(m, n); }));
    return el;
  }

  function renderLearn(root, sub, data) {
    const top = new Set(sub.top);
    let qs = data.longs.filter((q) => q.module === moduleTab);
    if (topOnly) qs = qs.filter((q) => top.has(q.n) || q.stars >= 2);
    qs.sort((a, b) => (top.has(b.n) - top.has(a.n)) || (b.stars - a.stars) || a.n - b.n);

    root.innerHTML = "";
    const tools = document.createElement("div");
    tools.className = "tools";
    tools.innerHTML =
      '<div class="seg" role="group" aria-label="Module">' +
      [1, 2, 3].map((m) => '<button type="button" data-m="' + m + '" aria-pressed="' + (m === moduleTab) + '">Module ' + m + "</button>").join("") +
      '</div><button type="button" class="chip" id="topOnly" aria-pressed="' + topOnly + '">Most asked only</button>';
    root.appendChild(tools);
    tools.querySelectorAll("[data-m]").forEach((b) => b.addEventListener("click", () => { moduleTab = +b.dataset.m; render(); }));
    tools.querySelector("#topOnly").addEventListener("click", () => { topOnly = !topOnly; render(); });

    const list = document.createElement("div");
    list.className = "list";
    list.style.marginTop = "12px";
    if (!qs.length) list.innerHTML = '<p class="empty">No questions match this filter.</p>';
    qs.forEach((q) => list.appendChild(card(q, top.has(q.n))));
    root.appendChild(list);
  }

  function card(q, isTop) {
    const k = key("Q" + q.n);
    const learned = !!progress.learned[k];
    const open = opened.has(k);
    const el = document.createElement("article");
    el.className = "card" + (learned ? " learned" : "");
    el.id = "q" + q.n;
    const badges = [];
    if (isTop) badges.push('<span class="badge top">Most asked</span>');
    if (q.stars) badges.push('<span class="badge star">' + "★".repeat(q.stars) + " asked before</span>");
    if (q.asked) badges.push('<span class="badge asked">' + esc(q.asked) + "</span>");
    el.innerHTML =
      '<div class="card-head"><span class="qnum">Q' + q.n + '</span><div class="qtext"><h3>' + inline(q.title) + '</h3><div class="meta">' + badges.join("") + "</div></div></div>" +
      (open ? "" : '<p class="hint">Recall the skeleton first: the headings, one diagram or formula, one example. Then reveal.</p>') +
      '<div class="card-actions"><button type="button" class="btn ' + (open ? "" : "primary") + '" data-act="toggle">' + (open ? "Hide answer" : "Show answer") + '</button><button type="button" class="btn ' + (learned ? "done" : "") + '" data-act="learn" aria-pressed="' + learned + '">' + (learned ? "Learned ✓" : "Mark learned") + "</button></div>" +
      (open ? '<div class="answer">' + mdToHtml(q.body) + "</div>" : "");
    el.querySelector('[data-act="toggle"]').addEventListener("click", () => { open ? opened.delete(k) : opened.add(k); el.replaceWith(card(q, isTop)); });
    el.querySelector('[data-act="learn"]').addEventListener("click", () => {
      if (progress.learned[k]) delete progress.learned[k]; else progress.learned[k] = true;
      saveProgress();
      el.replaceWith(card(q, isTop));
      renderProgress(SUBJECTS[subIdx], cache[SUBJECTS[subIdx].code]);
    });
    return el;
  }

  function renderFlash(root, sub, data) {
    const items = data.partA;
    if (!flashOrder || flashOrder.length !== items.length) flashOrder = items.map((_, i) => i);
    if (!items.length) { root.innerHTML = '<p class="empty">No Part A answers found.</p>'; return; }
    flashIdx = Math.min(flashIdx, items.length - 1);
    const it = items[flashOrder[flashIdx]];
    const k = key(it.id);
    const known = !!progress.known[k];
    root.innerHTML =
      '<div class="tools"><button type="button" class="chip" id="shuffle">Shuffle</button><button type="button" class="chip" id="unknown">Jump to next not-known</button></div>' +
      '<div class="flash' + (known ? " known" : "") + '" id="flash" role="button" tabindex="0" aria-label="Flip card" style="margin-top:12px">' +
      '<span class="side">' + (flashFlipped ? "Answer · 3 marks" : "Part A question · tap to flip") + "</span>" +
      '<div class="front">' + inline(it.q) + "</div>" +
      (flashFlipped ? '<div class="back">' + inline(it.a) + "</div>" : "") +
      "</div>" +
      '<div class="flash-nav" style="margin-top:12px"><button type="button" class="btn" id="prev">← Previous</button><span class="counter">' + (flashIdx + 1) + " / " + items.length + '</span><button type="button" class="btn ' + (known ? "done" : "") + '" id="know" aria-pressed="' + known + '">' + (known ? "I know this ✓" : "Mark known") + '</button><button type="button" class="btn primary" id="next">Next →</button></div>';
    const flip = () => { flashFlipped = !flashFlipped; renderFlash(root, sub, data); };
    const f = root.querySelector("#flash");
    f.addEventListener("click", flip);
    f.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } });
    root.querySelector("#prev").addEventListener("click", () => { flashIdx = (flashIdx - 1 + items.length) % items.length; flashFlipped = false; renderFlash(root, sub, data); });
    root.querySelector("#next").addEventListener("click", () => { flashIdx = (flashIdx + 1) % items.length; flashFlipped = false; renderFlash(root, sub, data); });
    root.querySelector("#know").addEventListener("click", () => { if (progress.known[k]) delete progress.known[k]; else progress.known[k] = true; saveProgress(); renderProgress(sub, data); renderFlash(root, sub, data); });
    root.querySelector("#shuffle").addEventListener("click", () => { for (let i = flashOrder.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [flashOrder[i], flashOrder[j]] = [flashOrder[j], flashOrder[i]]; } flashIdx = 0; flashFlipped = false; renderFlash(root, sub, data); });
    root.querySelector("#unknown").addEventListener("click", () => {
      for (let s = 1; s <= items.length; s++) { const i = (flashIdx + s) % items.length; if (!progress.known[key(items[flashOrder[i]].id)]) { flashIdx = i; flashFlipped = false; return renderFlash(root, sub, data); } }
    });
  }

  function renderFormulas(root, sub) {
    root.innerHTML = '<div class="list">' + sub.formulas.map((g) =>
      '<section class="formula-group"><h2>' + esc(g.g) + "</h2>" + g.items.map((f) =>
        '<div class="f"><span class="n">' + esc(f[0]) + '</span><span class="e">' + esc(f[1]) + "</span>" + (f[2] ? '<span class="r">' + esc(f[2]) + "</span>" : "") + "</div>"
      ).join("") + "</section>").join("") + "</div>";
  }

  /* ---------- mock exam ---------- */
  const pick = (arr, n) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a.slice(0, n); };
  const fmt = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60; return h + ":" + String(m).padStart(2, "0") + ":" + String(x).padStart(2, "0"); };
  let tick = null;

  function newPaper(data) {
    return {
      partA: pick(data.partA, 9),
      mods: [1, 2, 3].map((m) => pick(data.longs.filter((q) => q.module === m), 3)),
    };
  }

  function renderMock(root, sub, data) {
    if (!mock || mock.code !== sub.code) mock = { code: sub.code, paper: newPaper(data), remaining: 3 * 3600 * 1000, running: false, endsAt: 0, showAns: false };
    const rem = mock.running ? mock.endsAt - Date.now() : mock.remaining;
    let qn = 0;
    root.innerHTML =
      '<div class="timer"><span class="clock' + (rem < 15 * 60 * 1000 ? " low" : "") + '" id="clock">' + fmt(rem) + "</span>" +
      '<button type="button" class="btn primary" id="startStop">' + (mock.running ? "Pause" : rem < 3 * 3600 * 1000 ? "Resume" : "Start 3-hour timer") + "</button>" +
      '<button type="button" class="btn" id="reset">Reset timer</button><button type="button" class="btn" id="newp">New paper</button>' +
      '<button type="button" class="btn" id="ans" aria-pressed="' + mock.showAns + '">' + (mock.showAns ? "Hide answer links" : "Show answer links") + "</button></div>" +
      '<article class="paper" style="margin-top:12px"><header><b>' + esc(sub.code) + " — " + esc(sub.name.toUpperCase()) + "</b><small>" + esc(sub.exam) + "</small><small>Time: 3 hours · Max. marks: 75 · Practice paper built from your answer sheet</small></header>" +
      '<h4>PART A</h4><p class="instr">Answer all questions. Each carries 3 marks.</p><ol>' +
      mock.paper.partA.map((p) => { qn++; return "<li>" + inline(p.q) + (mock.showAns ? ' <small style="color:var(--muted)">— ' + inline(p.a) + "</small>" : "") + "</li>"; }).join("") +
      '</ol><p class="marks">(9 × 3 = 27 marks)</p><h4>PART B</h4><p class="instr">Answer any two questions from each module. Each carries 8 marks.</p>' +
      mock.paper.mods.map((qs, i) => '<h4>Module ' + ["I", "II", "III"][i] + '</h4><ol start="' + (qn + 1) + '">' + qs.map((q) => { qn++; return "<li>" + inline(q.title) + (mock.showAns ? ' <a href="#learn" data-goto="' + q.module + ":" + q.n + '">(see Q' + q.n + ")</a>" : "") + "</li>"; }).join("") + "</ol>").join("") +
      '<p class="marks">(6 × 8 = 48 marks)</p></article>';

    root.querySelector("#startStop").addEventListener("click", () => {
      if (mock.running) { mock.remaining = mock.endsAt - Date.now(); mock.running = false; clearInterval(tick); }
      else { mock.endsAt = Date.now() + mock.remaining; mock.running = true; startTick(); }
      renderMock(root, sub, data);
    });
    root.querySelector("#reset").addEventListener("click", () => { clearInterval(tick); mock.running = false; mock.remaining = 3 * 3600 * 1000; renderMock(root, sub, data); });
    root.querySelector("#newp").addEventListener("click", () => { mock.paper = newPaper(data); renderMock(root, sub, data); });
    root.querySelector("#ans").addEventListener("click", () => { mock.showAns = !mock.showAns; renderMock(root, sub, data); });
    root.querySelectorAll("[data-goto]").forEach((a) => a.addEventListener("click", () => {
      const [m, n] = a.dataset.goto.split(":").map(Number);
      moduleTab = m; topOnly = false; opened.add(key("Q" + n));
      setTimeout(() => { const t = document.getElementById("q" + n); if (t) t.scrollIntoView({ block: "start" }); }, 60);
    }));
    if (mock.running) startTick();
  }

  function startTick() {
    clearInterval(tick);
    tick = setInterval(() => {
      const c = document.getElementById("clock");
      if (!mock || !mock.running) return clearInterval(tick);
      const rem = mock.endsAt - Date.now();
      if (rem <= 0) { mock.running = false; mock.remaining = 0; clearInterval(tick); if (c) c.textContent = "Time's up"; return; }
      if (c) { c.textContent = fmt(rem); c.classList.toggle("low", rem < 15 * 60 * 1000); }
    }, 1000);
  }

  render();
  connectStore();
})();
</script>
